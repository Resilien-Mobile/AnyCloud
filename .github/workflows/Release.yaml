name: AnyCloud CD

on:
  push:
    # tag 触发发布
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 还原 release JKS 证书到项目根目录
      - name: Restore release keystore
        shell: bash
        run: |
          echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > release.jks
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      # 验证 release JKS 证书 MD5，校验失败则终止 runner
      - name: Verify release keystore MD5
        shell: bash
        run: |
          expected_md5="959184b1d6e2fbdb72fb2ee33f9eb78b"
          actual_md5="$(md5sum release.jks | awk '{ print $1 }')"

          if [ "${actual_md5}" != "${expected_md5}" ]; then
            echo "::error::证书错误"
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      # 构建 release APK
      - name: Build release APK
        run: ./gradlew assembleGithub
        env:
          DEBUG_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      # 读取 asset/markdown/release/<tag>.md 作为发布说明
      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: app/build/outputs/apk/**/*.apk
          body_path: asset/markdown/release/${{ github.ref_name }}.md